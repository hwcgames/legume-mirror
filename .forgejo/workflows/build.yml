on: [push]
jobs:
  build:
    name: build-${{matrix.target}}
    runs-on: docker
    container:
      image: docker.io/barichello/godot-ci:mono-4.6
    strategy:
      matrix:
        target: ["linux", "windows", "macos"]
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          github-server-url: https://forge.wolo.dev
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/4.6.stable.mono ~/.local/share/godot/export_templates/4.6.stable.mono
      - name: Build
        run: |
          mkdir -p exp
          godot --headless --verbose --export-release ${{matrix.target}}
      - name: Push artifacts
        uses: https://data.forgejo.org/actions/upload-artifact@v4
        with:
          name: "lt-${{matrix.target}}"
          path: exp
          compression-level: 9
      - name: Upload to itchio
        uses: https://github.com/KikimoraGames/itch-publish@v0.0.3
        with:
          butlerApiKey: ${{secrets.BUTLER_API_KEY}}
          gameData: ${{ steps.build.outputs.build }}
          itchUsername: hwcgames
          itchGameId: hwcrpg
          buildChannel: auto-${{ matrix.target }}
          buildNumber: ${{ needs.version.outputs.version_hash }}
